# Builds every package on each push and pull request, including the
# commits of driver.lock made by the driver's release workflow (pushed with
# a token that triggers workflows), and attaches them to a GitHub release
# on tags v*.
#
# No secret is needed: while driver.lock is the placeholder, the packages
# hold stub drivers (and cannot be released); signing steps run only when
# their secrets exist, so forks build unsigned packages.
#
# Actions are pinned by commit SHA (the tag in the comment).
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  # Tauri's Linux build prerequisites.
  TAURI_APT_PACKAGES: >-
    libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev libssl-dev build-essential file

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scripts' tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Shellcheck
        run: shellcheck scripts/make-icons packaging/linux/scripts/*.sh packaging/macos/*.sh packaging/macos/scripts/*/*
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Frontend
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: System libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a word list on purpose
          sudo apt-get install -y --no-install-recommends $TAURI_APT_PACKAGES
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix flake check -L

  driver:
    runs-on: ubuntu-latest
    outputs:
      stub: ${{ steps.fetch.outputs.stub }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the driver (stubs while driver.lock is the placeholder)
        id: fetch
        run: |
          if python3 -c 'import json, sys; sys.exit(0 if json.load(open("driver.lock"))["assets"] else 1)'; then
            scripts/fetch-driver
            echo "stub=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::driver.lock lists no driver release: building with stub binaries"
            scripts/fetch-driver --stub
            echo "stub=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver
          path: dist/driver
          retention-days: 3

  linux:
    needs: driver
    runs-on: ubuntu-latest
    env:
      HAS_RPM_KEY: ${{ secrets.RPM_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: driver
          path: dist/driver
      - name: System libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086 # a word list on purpose
          sudo apt-get install -y --no-install-recommends $TAURI_APT_PACKAGES
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run tauri build -- --no-bundle -- --locked
      - name: RPM signing key (optional)
        if: env.HAS_RPM_KEY == 'true'
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/rpm-signing.asc"
          printf '%s\n' "$RPM_SIGNING_KEY" > "$key"
          echo "NFPM_RPM_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: deb and rpm
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: scripts/build-linux-packages --ui target/release/sinden-driver-ui
      - name: AUR
        run: scripts/build-aur
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/packages/*.deb
            dist/packages/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur
          path: dist/aur
          include-hidden-files: true

  windows:
    needs: driver
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: driver
          path: dist/driver
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run tauri build -- --no-bundle -- --locked
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Code signing (optional)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $sign = "`"$signtool`" sign /f `"$pfx`" /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256"
          foreach ($exe in @("dist\driver\x86_64-pc-windows-msvc\sinden-driver.exe", "target\release\sinden-driver-ui.exe")) {
            cmd /c "$sign `"$exe`""
            if ($LASTEXITCODE -ne 0) { throw "signing $exe failed" }
          }
          "SIGNTOOL_CMD=$sign `$f" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installer
        shell: pwsh
        run: packaging\windows\build-installer.ps1 -UiExe target\release\sinden-driver-ui.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/packages/*.exe

  macos:
    needs: driver
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: driver
          path: dist/driver
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run tauri build -- --target universal-apple-darwin --bundles app -- --locked
      - name: Signing identities (optional)
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_APP_IDENTITY=$MACOS_APP_IDENTITY" >> "$GITHUB_ENV"
          echo "MACOS_INSTALLER_IDENTITY=$MACOS_INSTALLER_IDENTITY" >> "$GITHUB_ENV"
      - name: Installer package
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/build-pkg.sh --ui "target/universal-apple-darwin/release/bundle/macos/Sinden Driver.app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg
          path: dist/packages/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, nix, driver, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse stub drivers and version mismatches
        env:
          STUB: ${{ needs.driver.outputs.stub }}
        run: |
          if [ "$STUB" = "true" ]; then
            echo "::error::driver.lock is the placeholder: no release with stub drivers"
            exit 1
          fi
          ui_version=$(python3 -c 'import json; print(json.load(open("ui/package.json"))["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$ui_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match ui/package.json ($ui_version)"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{linux-packages,windows-installer,macos-pkg}"
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur
          path: aur
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C aur -czf release/aur-pkgbuilds.tar.gz .
          (cd release && sha256sum -- * > SHA256SUMS)
          driver_version=$(python3 -c 'import json; print(json.load(open("driver.lock"))["version"])')
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "sinden-ui $GITHUB_REF_NAME" \
            --notes "Packages of sinden-driver $driver_version and sinden-driver-ui ${GITHUB_REF_NAME#v}. The sinden-driver binaries are MIT-licensed, without their source: see NOTICE." \
            release/*
