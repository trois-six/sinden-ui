[package]
name = "sinden-driver-ui"
version = "0.1.0"
description = "Tray application configuring the sinden-driver service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "sinden-driver-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sinden-control = { path = "../../crates/sinden-control" }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.7"
tauri-plugin-single-instance = "2.5"

[lints]
workspace = true
